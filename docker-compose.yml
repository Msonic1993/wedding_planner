services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:delegated
      - composer-vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
    command: ["sh", "-lc", "php artisan storage:link --force && exec php-fpm"]
    networks:
      - wedding-planet

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:delegated
      - composer-vendor:/var/www/html/vendor
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PUBLIC_PORT:-8083}:8080"
    depends_on:
      - redis
    networks:
      - wedding-planet

  # A dedicated worker per queue: with block_for, a worker listening on several queues
  # would block on an empty one and delay chat broadcasts by up to REDIS_QUEUE_BLOCK_FOR seconds.
  queue-broadcasts:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:delegated
      - composer-vendor:/var/www/html/vendor
    command: ["php", "artisan", "queue:work", "redis", "--queue=broadcasts", "--tries=3"]
    depends_on:
      - redis
    networks:
      - wedding-planet

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:delegated
      - composer-vendor:/var/www/html/vendor
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3"]
    depends_on:
      - redis
      - mysql
    networks:
      - wedding-planet

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - wedding-planet

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wedding_planet}
      MYSQL_USER: ${DB_USERNAME:-wedding_planet}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - wedding-planet

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - wedding-planet

networks:
  wedding-planet:
    driver: bridge

volumes:
  composer-vendor:
  mysql-data:
  redis-data:
